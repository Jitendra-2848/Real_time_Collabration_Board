version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: whiteboard-db
    environment:
      POSTGRES_DB: whiteboard
      POSTGRES_USER: whiteboard_user
      POSTGRES_PASSWORD: whiteboard_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard_user -d whiteboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whiteboard-network

  redis:
    image: redis:7-alpine
    container_name: whiteboard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whiteboard-network

  nginx:
    image: nginx:1.25-alpine
    container_name: whiteboard-nginx-proxy
    ports:
      - "8000:80"
    volumes:
      - ./server/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      app1:
        condition: service_healthy
    networks:
      - whiteboard-network

  app:
    build: ./server
    image: local-whiteboard:latest
    container_name: whiteboard-app-1
    environment:
      - INSTANCE_ID=1
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgres://whiteboard_user:whiteboard_password@db:5432/whiteboard
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=access_secret_token_123456
      - JWT_REFRESH_SECRET=refresh_secret_token_7891011
      - CLIENT_URL=http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - whiteboard-network

  app1:
    image: local-whiteboard:latest
    container_name: whiteboard-app-2
    environment:
      - INSTANCE_ID=2
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgres://whiteboard_user:whiteboard_password@db:5432/whiteboard
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=access_secret_token_123456
      - JWT_REFRESH_SECRET=refresh_secret_token_7891011
      - CLIENT_URL=http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - whiteboard-network

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_SOCKET_URL=http://localhost:8000
    container_name: whiteboard-client
    ports:
      - "80:80"
    restart: always
    depends_on:
      - nginx
    networks:
      - whiteboard-network

volumes:
  pgdata:

networks:
  whiteboard-network:
    driver: bridge
