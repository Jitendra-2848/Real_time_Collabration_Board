version: "3.8"

services:

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      app1:
        condition: service_healthy
    networks:
      - whiteboard-network

  app:
    build: .
    image: local-whiteboard:latest
    container_name: whiteboard-app-1
    environment:
      - INSTANCE_ID=1
      - NODE_ENV=production
      - PORT=8000
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - whiteboard-network

  app1:
    image: local-whiteboard:latest
    container_name: whiteboard-app-2
    environment:
      - INSTANCE_ID=2
      - NODE_ENV=production
      - PORT=8000
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - whiteboard-network

networks:
  whiteboard-network:
    driver: bridge